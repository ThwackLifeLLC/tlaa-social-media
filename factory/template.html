<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Barlow Condensed';font-weight:700;src:url('FONT_BC')}
@font-face{font-family:'Montserrat';font-weight:600;src:url('FONT_M6')}
@font-face{font-family:'Montserrat';font-weight:800;src:url('FONT_M8')}
:root{--o:#FB5504}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d0d0f}
#bg{position:absolute;inset:0;background:radial-gradient(1100px 1100px at 78% 12%,rgba(251,85,4,.42),rgba(251,85,4,0) 70%),#0d0d0f}
#photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0}
#shade{position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,rgba(13,13,15,.55) 0%,rgba(13,13,15,.35) 30%,rgba(13,13,15,.78) 62%,rgba(13,13,15,.96) 100%)}
.h.hook{font-size:170px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#rings{position:absolute;left:50%;top:44%;width:1500px;height:1500px;transform:translate(-50%,-50%);opacity:.07}
#stage{position:absolute;left:96px;right:150px;top:300px;height:930px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font:600 34px Montserrat;letter-spacing:.2em;text-transform:uppercase;color:var(--o);margin-bottom:26px}
.h{font:700 150px/1.0 'Barlow Condensed';text-transform:uppercase;color:#fff;letter-spacing:.005em}
.h .a{color:var(--c,var(--o))}
.sub{font:600 48px/1.28 Montserrat;color:#e9e9ea;margin-top:34px}
.stack div{font:700 136px/1.14 'Barlow Condensed';text-transform:uppercase;color:#fff;white-space:nowrap}
.stack div.a{color:var(--o)}
.card{border-left:18px solid var(--c);background:#1a1a1d;border-radius:26px;padding:60px 54px}
.card .t{font:700 138px/1 'Barlow Condensed';text-transform:uppercase;color:var(--c)}
.card .s{font:600 50px/1.25 Montserrat;color:#f1f1f2;margin-top:24px}
.logo{width:430px;height:430px;display:block;margin-bottom:46px}
.url{font:700 128px/1 'Barlow Condensed';color:var(--o)}
.brandline{font:600 44px/1.3 Montserrat;color:#fff;margin-bottom:30px}
#cap{position:absolute;left:70px;right:150px;top:1250px;min-height:190px;text-align:center;font:800 56px/1.26 Montserrat;color:#fff}
#cap span{white-space:nowrap;display:inline-block;padding:0 5px;border-radius:9px;opacity:.62}
#cap span.on{opacity:1;color:#fff;background:var(--o)}
#cap span.past{opacity:1}
#mark{position:absolute;right:70px;top:150px;width:96px;height:96px}
#svg{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
</style></head>
<body>
<div id="bg"></div>
<div id="photo"></div>
<div id="shade"></div>
<svg id="rings" viewBox="0 0 100 100"><g fill="none" stroke="#fff" stroke-width=".7"><circle cx="50" cy="50" r="49"/><circle cx="50" cy="50" r="39"/><circle cx="50" cy="50" r="29"/><circle cx="50" cy="50" r="19"/><circle cx="50" cy="50" r="9"/></g></svg>
<div id="stage"></div>
<img id="mark" src="LOGO">
<div id="cap"></div>
<script>
const S=SPEC;
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const photo=document.getElementById('photo'),shade=document.getElementById('shade'),stage=document.getElementById('stage'),cap=document.getElementById('cap'),mark=document.getElementById('mark'),rings=document.getElementById('rings');
let cur=-1,capKey=null;
function build(s){
  if(s.type==='title')return `<img class="logo" src="LOGO"><div class="h">${s.head}</div>`;
  if(s.type==='hook')return `${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<div class="h hook" style="font-size:${s.size||170}px">${s.head}</div>`;
  if(s.type==='line')return `${s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:''}<div class="h" style="font-size:${s.size||150}px;${s.nowrap?'white-space:nowrap':''}">${s.head}</div>${s.sub?`<div class="sub">${s.sub}</div>`:''}`;
  if(s.type==='stack')return `<div class="stack">${s.items.map((x,i)=>`<div data-at="${x.at}" class="${x.a?'a':''}" style="font-size:${s.size||136}px">${x.t}</div>`).join('')}</div>`;
  if(s.type==='card')return `<div class="eyebrow">${s.eyebrow||''}</div><div class="card" style="--c:${s.color}"><div class="t" style="font-size:${s.size||138}px">${s.head}</div><div class="s">${s.sub}</div></div>`;
  if(s.type==='end')return `<img class="logo" src="LOGO"><div class="brandline">${s.line}</div><div class="url">${s.url}</div>`;
}
window.draw=t=>{
  const i=S.scenes.findIndex(s=>t>=s.start&&t<s.end);const k=i<0?S.scenes.length-1:i;const s=S.scenes[k];
  if(k!==cur){stage.innerHTML=build(s);cur=k;if(s.photo)photo.style.backgroundImage=`url(${s.photo})`;}
  const p=ease((t-s.start)/.32);
  stage.style.opacity=p;stage.style.transform=`translateY(${(1-p)*46}px)`;
  stage.querySelectorAll('[data-at]').forEach(el=>{const q=ease((t-+el.dataset.at)/.22);el.style.opacity=q;el.style.transform=`translateX(${(1-q)*-50}px)`;});
  const ph=s.photo?ease((t-s.start)/.4):0;photo.style.opacity=ph;shade.style.opacity=ph;
  if(s.photo)photo.style.transform=`scale(${1.04+(t-s.start)*.012})`;
  rings.style.opacity=s.photo?0:.07;
  const isBig=s.type==='title'||s.type==='end';
  mark.style.opacity=isBig?0:1;
  rings.style.transform=`translate(-50%,-50%) scale(${1+t*.006}) rotate(${t*.5}deg)`;
  const c=S.captions.find(c=>t>=c.start&&t<c.end);
  const key=c?c.start:'none';
  if(key!==capKey){cap.innerHTML=c?c.words.map(w=>`<span data-s="${w.start}" data-e="${w.end}">${w.text}</span>`).join(' '):'';capKey=key;}
  cap.querySelectorAll('span').forEach(el=>{const a=+el.dataset.s,b=+el.dataset.e;el.className=t>=a&&t<b+.04?'on':t>=b?'past':'';});
};
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]);
</script>
</body></html>
